name: Deploy English Adventure Web to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "English Adventure/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "English Adventure"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Project Data & Scene References
        run: python3 tests/content_validation/validate_prompt_02.py

      - name: Setup Godot 4.3 with Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import Godot Resources (Headless)
        run: godot --headless --import

      - name: Export Godot Web Build
        run: |
          mkdir -p builds/web
          godot --headless --verbose --export-release "Web" builds/web/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "English Adventure/builds/web"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Game học tiếng Anh từ đầu cho người mới: 10 thế giới phonics, từ âm đến trọng âm và connected speech.">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Phonics Quest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" data-action="back" id="btn-back" hidden aria-label="Quay lại">←</button>
      <div class="brand">
        <span class="brand-mark">Aa</span>
        <div>
          <strong id="top-title">Phonics Quest</strong>
          <p id="top-sub">10 thế giới âm tiếng Anh</p>
        </div>
      </div>
      <div class="xp-chip" id="xp-chip" title="Điểm kinh nghiệm">⭐ 0</div>
    </header>

    <main class="view" id="view"></main>

    <section id="tree-screen" class="tree-screen hidden" aria-label="Bản đồ cây kỹ năng">
      <div class="tree-controls">
        <button class="control-btn" data-action="zoom-in" title="Phóng to">➕</button>
        <button class="control-btn" data-action="zoom-out" title="Thu nhỏ">➖</button>
        <button class="control-btn" data-action="zoom-fit" title="Về trạm hiện tại">🎯</button>
      </div>
      <div class="svg-wrap" id="svg-wrap">
        <svg id="skill-svg" width="100%" height="100%">
          <defs>
            <linearGradient id="gold-glow" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fde68a"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
            <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="skill-zoom"></g>
        </svg>
      </div>
      <div id="node-sheet" class="node-sheet hidden"></div>
    </section>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-action="tab" data-tab="home">
        <span>🏠</span><small>Nhà</small>
      </button>
      <button class="tab" data-action="tab" data-tab="map">
        <span>🌳</span><small>Cây</small>
      </button>
      <button class="tab" data-action="tab" data-tab="dict">
        <span>📖</span><small>Sổ tay</small>
      </button>
      <button class="tab" data-action="tab" data-tab="me">
        <span>👤</span><small>Tôi</small>
      </button>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="tree.js"></script>
  <script src="game.js"></script>
</body>
</html>

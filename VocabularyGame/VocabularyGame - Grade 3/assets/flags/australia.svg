<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" width="30" height="20">
  <rect width="30" height="20" fill="#00247d"/>
  <!-- Union Jack simplified -->
  <polygon points="0,0 30,20" fill="#fff" opacity="0.5"/>
  <polygon points="30,0 0,20" fill="#fff" opacity="0.5"/>
  <rect x="0" y="0" width="30" height="20" fill="none" stroke="#cf142b" stroke-width="2"/>
  <!-- Stars simplified -->
  <circle cx="12" cy="8" r="1" fill="#fff"/>
  <circle cx="15" cy="8" r="1" fill="#fff"/>
  <circle cx="18" cy="8" r="1" fill="#fff"/>
  <circle cx="13.5" cy="10" r="1" fill="#fff"/>
  <circle cx="16.5" cy="10" r="1" fill="#fff"/>
</svg>
